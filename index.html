<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria IPAVC</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .fundo-animado {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .fundo-animado .animacao {
      position: absolute;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .fundo-animado .visivel {
      opacity: 1;
    }

    .conteudo {
      position: relative;
      z-index: 1;
      color: white;
      text-align: center;
      padding: 60px 20px;
    }
  </style>
</head>
<body>

  <!-- Fundo Animado -->
  <div class="fundo-animado">
    <div class="animacao visivel" style="background-image: url('imagens/serpente-tinta.gif');"></div>
    <div class="animacao" style="background-image: url('imagens/ave-voando.gif');"></div>
    <div class="animacao" style="background-image: url('imagens/ondas-mar.gif');"></div>
    <div class="animacao" style="background-image: url('imagens/aurora-boreal.gif');"></div>
    <div class="animacao" style="background-image: url('imagens/estrela.gif');"></div>
  </div>

  <!-- Conteúdo principal -->
  <div class="conteudo">
    <h1>Galeria Artística IPAVC</h1>
    <p>Explore a beleza da arte, natureza e movimento.</p>
  </div>

  <!-- Música de fundo -->
  <audio autoplay loop>
    <source src="imagens/fundo-suave.mp3" type="audio/mp3">
  </audio>

  <!-- Script de troca de fundo -->
  <script>
    const fundos = document.querySelectorAll('.fundo-animado .animacao');
    let atual = 0;

    setInterval(() => {
      fundos[atual].classList.remove('visivel');
      atual = (atual + 1) % fundos.length;
      fundos[atual].classList.add('visivel');
    }, 3000);
  </script>

</body>
</html>
