     <!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galeria IPAVC</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: #f4f4f4;
      color: #333;
      line-height: 1.6;
    }

    header {
      background: #A11212;
      color: #fff;
      padding: 1rem 2rem;
      text-align: center;
    }

    header h1 {
      margin-bottom: 0.2rem;
    }

    header p {
      font-size: 1rem;
      opacity: 0.9;
    }

    .galeria-container {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .grid-galeria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
    }

    .grid-galeria img {
      width: 100%;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .grid-galeria img:hover {
      transform: scale(1.05);
    }

    footer {
      background: #A11212;
      color: #fff;
      text-align: center;
      padding: 1rem;
      margin-top: 2rem;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      padding-top: 80px;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.8);
    }

    .modal-content {
      margin: auto;
      display: block;
      max-width: 80%;
      border-radius: 10px;
    }

    .close {
      position: absolute;
      top: 30px;
      right: 35px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover {
      color: #f1f1f1;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 1.5rem;
      }

      .close {
        font-size: 30px;
        right: 20px;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>Galeria IPAVC</h1>
  <p>Imagens das nossas atividades culturais e educacionais</p>
</header>

<section class="galeria-container">
  <div class="grid-galeria">
    <img src="img1.jpg" alt="Foto 1" onclick="abrirModal(this.src)">
    <img src="img2.jpg" alt="Foto 2" onclick="abrirModal(this.src)">
    <img src="img3.jpg" alt="Foto 3" onclick="abrirModal(this.src)">
    <img src="img4.jpg" alt="Foto 4" onclick="abrirModal(this.src)">
    <img src="img5.jpg" alt="Foto 5" onclick="abrirModal(this.src)">
    <img src="img6.jpg" alt="Foto 6" onclick="abrirModal(this.src)">
    <!-- Adicione mais imagens conforme necessário -->
  </div>
</section>

<!-- Modal -->
<div id="modal" class="modal" onclick="fecharModal()">
  <span class="close" onclick="fecharModal()">&times;</span>
  <img class="modal-content" id="imagemModal">
</div>

<footer>
  <p>&copy; 2025 IPAVC - Instituto Politécnico de Artes Visuais e Cultura</p>
</footer>

<script>
  function abrirModal(src) {
    document.getElementById("modal").style.display = "block";
    document.getElementById("imagemModal").src = src;
  }

  function fecharModal() {
    document.getElementById("modal").style.display = "none";
  }
</script>

</body>
</html>
