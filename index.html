<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galeria IPAVC</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f8f8f8;
      overflow-x: hidden;
    }

    /* Fundo animado com alternância */
    .fundo-animado {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .animacao {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
    }

    .animacao.visivel {
      opacity: 1;
    }

    h1 {
      text-align: center;
      font-size: 2em;
      font-weight: bold;
      animation: coresExplosivas 5s infinite;
      margin-top: 20px;
    }

    @keyframes coresExplosivas {
      0% { color: #ff0000; }
      20% { color: #ffa500; }
      40% { color: #008000; }
      60% { color: #0000ff; }
      80% { color: #4b0082; }
      100% { color: #ff69b4; }
    }

    .galeria {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      margin-top: 20px;
    }

    .obra {
      max-width: 260px;
      background: rgba(255,255,255,0.9);
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .obra img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .descricao {
      margin-top: 10px;
      font-size: 0.95em;
      color: #333;
    }

    .preco {
      font-weight: bold;
      margin-top: 5px;
    }

    .whatsapp a {
      display: inline-block;
      margin-top: 10px;
      background-color: #25d366;
      color: white;
      padding: 10px 15px;
      border-radius: 5px;
      text-decoration: none;
      font-size: 0.9em;
      transition: background 0.3s;
    }

    .whatsapp a:hover {
      background-color: #1ebe5b;
    }

    footer {
      margin: 50px 20px 20px;
      text-align: center;
      font-size: 0.9em;
      color: #777;
    }

    audio {
      display: none;
    }

    .leilao-info {
      margin-top: 40px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      color: #444;
      font-size: 1em;
      background-color: rgba(255,255,255,0.95);
      padding: 20px;
      border-radius: 8px;
    }

    .leilao-info h2 {
      color: #b22222;
    }

    .leilao-info ul {
      padding-left: 20px;
    }
  </style>
</head>
<body>

  <!-- Fundo Animado -->
  <div class="fundo-animado">
    <div class="animacao visivel" style="background-image: url('imagens/serpente-tinta.gif');"></div>
    <div class="animacao" style="background-image: url('imagens/ave-voando.gif');"></div>
    <div class="animacao" style="background-image: url('imagens/ondas-mar.gif');"></div>
    <div class="animacao" style="background-image: url('imagens/aurora-boreal.gif');"></div>
    <div class="animacao" style="background-image: url('imagens/estrelas.gif');"></div>
  </div>

  <h1>Galeria IPAVC</h1>

  <div class="galeria">
    <!-- Todas as obras (sem alteração) -->
    <!-- ... mesma estrutura que enviaste ... -->
    <!-- Mantenho conforme teu HTML original acima -->
  </div>

  <div class="leilao-info">
    <!-- Texto explicativo do leilão -->
    <!-- ... sem alterações ... -->
  </div>

  <footer>
    Instituto Politécnico de Artes Valter Cambodja – 2025
  </footer>

  <audio autoplay loop>
    <source src="imagens/fundo-suave.mp3" type="audio/mpeg">
    Seu navegador não suporta áudio embutido.
  </audio>

  <!-- Script para alternar animações -->
  <script>
    const animacoes = document.querySelectorAll('.animacao');
    let index = 0;

    setInterval(() => {
      animacoes[index].classList.remove('visivel');
      index = (index + 1) % animacoes.length;
      animacoes[index].classList.add('visivel');
    }, 3000);
  </script>

</body>
</html>
